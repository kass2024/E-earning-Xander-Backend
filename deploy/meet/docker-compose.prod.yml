services:
  mysql:
    image: mysql:8.0.35
    container_name: meet_mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - meet_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  backend:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: meet_backend
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      LOG_CHANNEL: stderr
    volumes:
      - meet_backend_storage:/var/www/html/storage
      - meet_backend_cache:/var/www/html/bootstrap/cache
    depends_on:
      mysql:
        condition: service_healthy

  scheduler:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: meet_scheduler
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      LOG_CHANNEL: stderr
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - meet_backend_storage:/var/www/html/storage
      - meet_backend_cache:/var/www/html/bootstrap/cache
    depends_on:
      - backend

  frontend:
    build:
      context: ../../../E-learning-parrot-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_APP_NAME: ${VITE_APP_NAME:-Xander Meet}
        VITE_APP_VERSION: ${VITE_APP_VERSION:-1.0.0}
        VITE_APP_BUILD_ID: ${VITE_APP_BUILD_ID:-prod}
    container_name: meet_frontend
    restart: unless-stopped
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    container_name: meet_nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MEET_HTTP_PORT:-8190}:80"
    volumes:
      - ./nginx/edge.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  meet_mysql_data:
  meet_backend_storage:
  meet_backend_cache:
